# 카메라별 고정 초점값 (focus_absolute, 0~255)
#
# focus_finder.py로 측정한 각 카메라의 최적 초점값(선명도 봉우리).
# 오토포커스를 끄고 이 값으로 고정해야 intrinsic이 안정적이다.
# 촬영 스크립트와 recorder가 이 파일을 읽어 카메라별로 적용한다.
#
# 주의: 이 값은 '작업거리'에 묶인다. 리그/실증처럼 거리가 바뀌면 재측정 후 갱신할 것.
# 측정 환경: 사무실 임시 거리 (2026-06-25) → Ranger mini 리그 재측정 완료 (2026-07-13)
#
# Ranger mini 실측 (focus_finder.py 스윕, focus_scan/cam{N}/sharpness.csv 참고):
# cam1: 400mm, 고원 0~75(381~434) 절벽 80~ → 고원 중앙 40 채택
# cam2: 고원 5~22(최고 260대) 절벽 23에서 확정(259.3→26.2, 1칸 차이 급락) → 절벽에서 3칸 여유 20 채택
# cam3: 고원 10~70(364~371) 절벽 75~ → 고원 중앙 35 채택
# cam4: 500mm, 고원 0~20(157~182, 노이즈성) 절벽 20~25 → 절벽에서 먼 10 채택

cam1: 40
cam2: 20
cam3: 35
cam4: 10
